name: AI App Regression CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow:
    name: Browser, API and Linux model
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - run: npx playwright install chromium --only-shell --with-deps
      - name: Run the workflow and verify the failure example
        shell: bash
        run: |
          mkdir -p artifacts
          node workflow/run.mjs --android off --output artifacts/smoke | tee artifacts/smoke-console.log
          grep -Fx 'Basic demo passed. Android skipped by request (--android off).' artifacts/smoke-console.log
          if node workflow/run.mjs --android off --fault wrong-device --output artifacts/wrong-device; then
            echo 'Expected the wrong-device fixture to fail.'
            exit 1
          fi
          node workflow/run.mjs --fixtures fixtures/custom-tickets.example.json --android off --output artifacts/custom
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const cases = JSON.parse(readFileSync('fixtures/custom-tickets.example.json', 'utf8'));
          cases[0].expected.category = 'noise';
          writeFileSync('artifacts/wrong-expected.json', JSON.stringify(cases));
          NODE
          if node workflow/run.mjs --fixtures artifacts/wrong-expected.json --android off --output artifacts/wrong-expected; then
            echo 'Expected the wrong label in the custom fixture to fail.'
            exit 1
          fi
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const read = name => JSON.parse(readFileSync(`artifacts/${name}/report.json`, 'utf8'));
          const good = read('smoke');
          const bad = read('wrong-device');
          assert.equal(good.status, 'partial');
          assert.equal(bad.status, 'failed');
          const demoSummary = 'Basic demo passed. Android skipped by request (--android off).';
          assert.ok(readFileSync('artifacts/smoke/report.html', 'utf8').includes(demoSummary));
          assert.ok(!readFileSync('artifacts/wrong-device/report.html', 'utf8').includes(demoSummary));
          for (const report of [good, bad]) {
            const status = name => report.steps.find(step => step.name === name)?.status;
            assert.ok(report.ticketId);
            for (const name of ['Linux model service', 'Web frontend', 'Backend API']) assert.equal(status(name), 'passed');
            assert.equal(status('Android device'), 'skipped');
          }
          assert.deepEqual(good.evaluation.accuracy, { passed: 4, total: 4 });
          assert.deepEqual(good.evaluation.robustness, { passed: 12, total: 12 });
          assert.deepEqual(bad.evaluation.accuracy, { passed: 3, total: 4 });
          assert.deepEqual(bad.evaluation.robustness, { passed: 9, total: 12 });
          const custom = read('custom');
          assert.equal(custom.status, 'partial');
          assert.deepEqual(custom.evaluation.accuracy, { passed: 2, total: 2 });
          assert.deepEqual(custom.evaluation.robustness, { passed: 1, total: 1 });
          const wrongExpected = read('wrong-expected');
          assert.equal(wrongExpected.status, 'failed');
          const [mismatch] = wrongExpected.evaluation.rows;
          assert.equal(mismatch.expected.category, 'noise');
          assert.equal(mismatch.actual.category, 'leak');
          assert.equal(mismatch.passed, false);
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workflow-reports
          path: artifacts/
          if-no-files-found: ignore

  android:
    name: Compile Android demo and test APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android build tools
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"'
      - name: Assemble debug and instrumentation APKs
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
