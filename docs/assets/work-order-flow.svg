<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" role="img" aria-labelledby="title description">
  <title id="title">Four-layer work-order flow</title>
  <desc id="description">Chromium creates a work order through the backend API. The backend calls the Linux model service to classify it. The browser, a separate API check, and the Android phone look up the completed ticket by ID.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#346761"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="288" rx="16" fill="#eef3f1" stroke="#cbd7d6"/>
  <g fill="#fff" stroke="#a4bfba">
    <rect x="24" y="42" width="220" height="88" rx="12"/>
    <rect x="716" y="42" width="220" height="88" rx="12"/>
    <rect x="370" y="180" width="220" height="88" rx="12"/>
  </g>
  <rect x="370" y="42" width="220" height="88" rx="12" fill="#142b3b"/>
  <g fill="none" stroke="#346761" stroke-width="2" marker-end="url(#arrow)">
    <path d="M244 86 H361"/>
    <path d="M590 86 H707"/>
    <path d="M480 180 V139"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g fill="#17232f" font-size="20" font-weight="700">
      <text x="134" y="78">Web</text>
      <text x="826" y="78">Linux model service</text>
      <text x="480" y="216">Android phone</text>
      <text x="480" y="78" fill="#f4faf9">Backend API</text>
    </g>
    <g fill="#42565f" font-size="14">
      <text x="134" y="103">Chromium form</text>
      <text x="826" y="103">Fixed or live response</text>
      <text x="480" y="241">Verify fields on screen</text>
      <text x="480" y="103" fill="#c4ddd9">Create and retrieve tickets</text>
      <text x="304" y="73">Submit / look up</text>
      <text x="651" y="73">Classify issue</text>
      <text x="536" y="161">Look up by ID</text>
    </g>
  </g>
</svg>
