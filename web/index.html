<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Work order intake | Maintenance Desk</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="masthead">
      <div class="shell brand">
        <span class="brand-mark" aria-hidden="true"></span>
        Maintenance Desk
      </div>
    </header>
    <main class="shell">
      <h1>Work order intake</h1>
      <p class="intro">Report an equipment issue to identify the device and classify the problem.</p>

      <div class="workspace">
        <form class="panel" id="work-order">
          <label for="description">Issue description</label>
          <p class="hint" id="description-hint">Include the equipment identifier and what you observed.</p>
          <textarea id="description" rows="5" required aria-describedby="description-hint form-error"
            placeholder="Example: Pump-3 is making a loud rattling noise."></textarea>
          <p id="form-error" role="alert"></p>
          <button type="submit">Submit work order</button>
        </form>

        <section class="panel result" aria-labelledby="result-heading">
          <h2 id="result-heading">Ticket result</h2>
          <p id="empty-result">Submit a work order to view its details here.</p>
          <dl class="ticket-fields" id="ticket-fields" hidden>
            <dt>Ticket ID</dt>
            <dd id="ticket-id"></dd>
            <dt>Device</dt>
            <dd id="ticket-device"></dd>
            <dt>Category</dt>
            <dd id="ticket-category"></dd>
            <dt>Status</dt>
            <dd><span id="ticket-status"></span></dd>
          </dl>
          <p class="visually-hidden" id="result-announcement" role="status"></p>
        </section>
      </div>
    </main>
  </body>
</html>
